<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b8fa6" />
    <title>Word Sprouts is resting</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(#bfeeff, #fff6dd 74%, #dcefc8); color: #173f43; font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
      main { width: min(440px, 100%); padding: 30px; border: 4px solid white; border-radius: 34px; background: rgb(255 255 255 / 86%); box-shadow: 0 9px 0 #8abec5; text-align: center; }
      img { width: 132px; height: 132px; border-radius: 30px; }
      h1 { margin: 18px 0 6px; font-size: 2rem; }
      p { margin: 0 0 20px; line-height: 1.5; }
      button { min-height: 52px; padding: 0 22px; border: 3px solid #ff9d93; border-radius: 18px; background: #ef6152; color: white; box-shadow: 0 5px 0 #b83d33; font: inherit; font-weight: 900; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Word Sprouts mascot" />
      <h1>Let’s grow again soon!</h1>
      <p>Word Sprouts needs the internet the first time it opens. Check the connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
