<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b8fa6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Word Sprouts" />
    <meta name="description" content="An audio-first English learning and city-building game for native English-speaking children ages 3–5." />
    <link rel="manifest" href="/word-sprouts/manifest.webmanifest" />
    <link rel="icon" href="/word-sprouts/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/word-sprouts/apple-touch-icon.png" />
    <meta property="og:title" content="Word Sprouts A1 City — Build words. Build a city." />
    <meta property="og:description" content="Audio-first speaking, listening, and early word recognition on a measurable CEFR A1 course path." />
    <meta property="og:image" content="/word-sprouts/og.png" />
    <title>Word Sprouts A1 City — Build words. Build a city.</title>
    <script>
      // Capture Chromium's one-shot install event before React loads. Some
      // Android devices fire it before the install component has mounted.
      window.__wordSproutsInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__wordSproutsInstallPrompt = event;
        window.dispatchEvent(new Event('word-sprouts-install-ready'));
      });
    </script>
    <script type="module" crossorigin src="/word-sprouts/app.js?v=15"></script>
    <link rel="stylesheet" crossorigin href="/word-sprouts/app.css?v=15">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
